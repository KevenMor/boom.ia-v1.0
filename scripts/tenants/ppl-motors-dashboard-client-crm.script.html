<!--
  PPL Motors — Cliente CRM v16 (app React completo + largura sidebar nativa)
  Console: "[Boom IA] Cliente CRM v16 carregado"
-->
<!--
  Boom IA — Dashboard Script · Cliente CRM na conversa (Chatwoot / Mega)
  =====================================================================

  O que faz:
  - Na sidebar DIREITA do chat (painel do contato): botão "Transformar em cliente"
    quando o contato ainda não é cliente no CRM.
  - Na área do chat (abaixo do cabeçalho da conversa): botão "Abrir cadastro do cliente"
    quando já convertido.
  - Abre painel lateral com iframe do cadastro (/api/embed/chatwoot/crm/view?contact_id=...).

  NÃO adiciona item na sidebar esquerda.

  Onde colar:
  - Mega: Super Admin → App Config → Dashboard Scripts
          https://mega.atendai.app/super_admin/app_config?config=internal

  Antes de colar, edite o bloco CFG:
  - BOOM_URL, EMBED_KEY, TARGET_ACCOUNT_ID

  Pré-requisitos:
  - Deploy server + frontend com rotas embed CRM
  - CHATWOOT_EMBED_FRAME_ANCESTORS=https://mega.atendai.app
  - Agente com config.chatwoot_account_id = conta Chatwoot

  Gerar cópia personalizada:
  - node scripts/chatwoot-generate-client-dashboard-script.mjs --boom-url=... --embed-key=... --account-id=9
-->

<script data-name="boom-ia-client-crm-conversation">
(function () {
  const SCRIPT_VERSION = "v16";
  const SCRIPT_KEY = "boom_ia_client_crm_conversation_" + SCRIPT_VERSION;
  if (window[SCRIPT_KEY]) return;
  window[SCRIPT_KEY] = true;
  console.info("[Boom IA] Cliente CRM " + SCRIPT_VERSION + " carregado");

  /** ========== CONFIGURE AQUI ========== */
  const CFG = {
    BOOM_URL: "https://ia.agboom.com.br",
    EMBED_CLIENT_URL: "https://ia.agboom.com.br/embed/chatwoot/client",
    EMBED_CLIENT_VIEW_URL: "https://ia.agboom.com.br/api/embed/chatwoot/crm/view",
    /** true = app React completo (todas as abas); false = HTML leve da API */
    USE_REACT_EMBED: true,
    API_BASE: "https://ia.agboom.com.br/api",
    EMBED_KEY: "iUDtFP4Rd9FyqNz3nkynZnkW",
    TARGET_ACCOUNT_ID: 9,
    MOBILE_MAX_WIDTH: 768,
  };
  /** ==================================== */

  const $ = (s, r) => {
    try {
      return (r || document).querySelector(s);
    } catch {
      return null;
    }
  };
  const $$ = (s, r) => {
    try {
      return Array.from((r || document).querySelectorAll(s));
    } catch {
      return [];
    }
  };
  const on = (el, ev, fn, opts) => {
    if (el) el.addEventListener(ev, fn, opts);
  };
  const normalize = (v) => (v || "").toLowerCase().replace(/\s+/g, " ").trim();

  let panel = null;
  let lookupTimer = null;
  let cleanupTimer = null;
  let applyTimer = null;
  let lastConversationKey = null;

  const crm = {
    loading: false,
    promoting: false,
    state: null,
    contactId: null,
    contactName: null,
    phoneDigits: null,
    error: null,
  };

  function routeText() {
    return window.location.pathname + window.location.search + window.location.hash;
  }

  function getAccountIdFromPath() {
    const m = routeText().match(/\/accounts\/(\d+)/);
    return m ? String(m[1]) : null;
  }

  function resolvedAccountId() {
    return getAccountIdFromPath() || String(CFG.TARGET_ACCOUNT_ID || "");
  }

  function getConversationIdFromPath() {
    const src = routeText();
    const patterns = [/\/conversations\/(\d+)/, /\/conversation\/(\d+)/, /conversation_id=(\d+)/i];
    for (let i = 0; i < patterns.length; i++) {
      const m = src.match(patterns[i]);
      if (m) return String(m[1]);
    }
    return null;
  }

  function isScopeAllowed() {
    if (CFG.TARGET_ACCOUNT_ID === null || CFG.TARGET_ACCOUNT_ID === "") return true;
    const acct = getAccountIdFromPath();
    if (!acct) return true;
    return acct === String(CFG.TARGET_ACCOUNT_ID);
  }

  function isConversationView() {
    if (getConversationIdFromPath()) return true;
    if (
      $(".conversation-panel") ||
      $('[data-testid="conversation-panel"]') ||
      $(".conversation-details-wrap") ||
      $(".messages-wrap")
    ) {
      return true;
    }
    if (
      $('[data-testid="reply-editor"]') ||
      $(".reply-box") ||
      $('textarea[placeholder*="mensagem" i]') ||
      $('textarea[placeholder*="message" i]')
    ) {
      return true;
    }
    if ($(".message-bubble") || $('[data-testid="message"]')) return true;
    const sidebar = findContactSidebar();
    return Boolean(sidebar && extractPhoneDigits(sidebar));
  }

  function brandColor() {
    const cs = getComputedStyle(document.documentElement);
    return (
      cs.getPropertyValue("--color-woot-500").trim() ||
      cs.getPropertyValue("--color-brand-primary").trim() ||
      "#1f93ff"
    );
  }

  function ensureStyles() {
    const id = "boom-ia-crm-conv-styles";
    if ($(id)) return;
    const s = document.createElement("style");
    s.id = id;
    s.textContent =
      ".boom-ia-crm-box{margin:12px 16px 0;padding:12px;border-radius:10px;border:1px solid var(--color-border,#e5e7eb);background:var(--color-background-light,#f9fafb);}" +
      ".boom-ia-crm-box p{margin:0 0 8px;font-size:12px;line-height:1.4;color:var(--color-body,#6b7280);}" +
      ".boom-ia-crm-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:8px 12px;border-radius:8px;border:0;font-size:13px;font-weight:600;cursor:pointer;}" +
      ".boom-ia-crm-btn:disabled{opacity:.6;cursor:not-allowed;}" +
      ".boom-ia-crm-btn-primary{color:#fff;}" +
      ".boom-ia-crm-btn-ghost{background:transparent;border:1px solid var(--color-border,#e5e7eb);color:var(--color-heading,#111);}" +
      ".boom-ia-crm-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:#dcfce7;color:#166534;}" +
      "#boom-ia-crm-chat-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--color-border,#e5e7eb);background:var(--color-background-light,#f9fafb);}" +
      "#boom-ia-crm-panel{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;z-index:100000;background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.15);display:flex;flex-direction:column;}" +
      "#boom-ia-crm-panel-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--color-border,#e5e7eb);}" +
      "#boom-ia-crm-panel iframe{flex:1;border:0;width:100%;}" +
      "html.boom-ia-crm-open-mobile #boom-ia-crm-panel{width:100vw!important;left:0!important;}" +
      "html.boom-ia-crm-open .reply-box,html.boom-ia-crm-open .reply-box__wrap,html.boom-ia-crm-open [data-testid='reply-editor'],html.boom-ia-crm-open .conversation-footer,html.boom-ia-crm-open .editor-wrap{display:none!important;}" +
      "html.boom-ia-crm-open,html.boom-ia-crm-open body{overflow:hidden!important;}";
    document.head.appendChild(s);
  }

  function panelFromNode(node) {
    let cur = node;
    for (let i = 0; i < 14 && cur; i++) {
      const r = cur.getBoundingClientRect();
      if (r.width > 200 && r.width < 520 && r.left > window.innerWidth * 0.42 && r.height > 180) {
        return cur;
      }
      cur = cur.parentElement;
    }
    return null;
  }

  function findContactSidebar() {
    const byTestId =
      $('[data-testid="contactPanel"]') ||
      $('[data-testid="contact-sidebar"]') ||
      $('[data-testid="contact-sidebar-panel"]') ||
      $(".conversation-sidebar") ||
      $(".contact--panel") ||
      $(".contact-panel");
    if (byTestId) return byTestId;

    for (const tel of $$('a[href^="tel:"]')) {
      const r = tel.getBoundingClientRect();
      if (r.left < window.innerWidth * 0.42) continue;
      const panel = panelFromNode(tel);
      if (panel) return panel;
    }

    const markers = [
      "ações da conversa",
      "etiquetas do contato",
      "atributos do contato",
      "notas do contato",
      "conversas anteriores",
      "macros",
      "kanban",
    ];
    for (const el of $$("div, section, aside, span, button, h2, h3, p, label")) {
      const t = normalize((el.textContent || "").slice(0, 80));
      if (!markers.some((m) => t === m || t.startsWith(m + " "))) continue;
      const panel = panelFromNode(el);
      if (panel) return panel;
    }

    const headings = ["contatos", "contact", "contacto"];
    for (const h of $$("h1, h2, h3, h4, .text-base, span, div")) {
      const t = normalize((h.textContent || "").slice(0, 40));
      if (!headings.some((x) => t === x)) continue;
      const panel = panelFromNode(h);
      if (panel) return panel;
    }

    let best = null;
    let bestLeft = 0;
    $$("div, aside, section").forEach((el) => {
      const r = el.getBoundingClientRect();
      if (r.height < 360 || r.width < 200 || r.width > 500) return;
      if (r.left < window.innerWidth * 0.5) return;
      if (r.left <= bestLeft) return;
      best = el;
      bestLeft = r.left;
    });
    return best;
  }

  function findSidebarInjectionPoint(sidebar) {
    if (!sidebar) return null;
    for (const el of $$("*", sidebar)) {
      const t = normalize((el.textContent || "").slice(0, 20));
      if (t === "kanban" || t === "ações da conversa") {
        const block = el.closest("div") || el.parentElement;
        if (block && sidebar.contains(block)) return block;
      }
    }
    const tel = $('a[href^="tel:"]', sidebar);
    if (tel) {
      let node = tel.parentElement;
      for (let i = 0; i < 6 && node; i++) {
        if (node.parentElement === sidebar || (node.parentElement && sidebar.contains(node.parentElement))) {
          return node.nextElementSibling || node.parentElement;
        }
        node = node.parentElement;
      }
    }
    return sidebar.firstElementChild;
  }

  function findChatHeaderAnchor() {
    const direct =
      $('[data-testid="conversation-header"]') ||
      $(".conversation-header") ||
      $(".conversation-details__header") ||
      $(".header-title-wrap")?.closest("div") ||
      $(".conversation-panel .header") ||
      $(".messages-wrap")?.previousElementSibling;
    if (direct) return direct;

    const resolver = [...$$("button, a")].find((el) => /resolver|resolve/i.test(el.textContent || ""));
    if (resolver) {
      let node = resolver.parentElement;
      for (let i = 0; i < 6 && node; i++) {
        const r = node.getBoundingClientRect();
        if (r.width > 300 && r.height < 120 && r.top < 120) return node;
        node = node.parentElement;
      }
    }

    const messages = $(".messages-wrap") || $('[data-testid="message-list"]') || $(".message-content");
    if (messages?.parentElement) return messages.parentElement.firstElementChild;

    const centerCols = $$("div, main, section").filter((el) => {
      const r = el.getBoundingClientRect();
      return r.width > 400 && r.left > 200 && r.left < window.innerWidth * 0.55 && r.top < 100 && r.height < 100;
    });
    return centerCols[0] || null;
  }

  function extractPhoneDigits(sidebar) {
    if (!sidebar) return null;
    const tel = $('a[href^="tel:"]', sidebar);
    if (tel) {
      const d = tel.getAttribute("href").replace(/\D/g, "");
      if (d.length >= 10) return d;
    }
    const text = sidebar.innerText || "";
    const m = text.match(/\+?\s*55\s*[\(\s]?\d{2}[\)\s]?\s*\d{4,5}[-\s]?\d{4}/);
    if (m) return m[0].replace(/\D/g, "");
    const m2 = text.match(/\(\d{2}\)\s*\d{4,5}[-\s]?\d{4}/);
    if (m2) return ("55" + m2[0]).replace(/\D/g, "");
    return null;
  }

  function extractContactName(sidebar) {
    if (!sidebar) return null;
    for (const h of $$("h2, h3, .text-base.font-medium, .contact--name, .truncate, strong", sidebar)) {
      const t = (h.textContent || "").trim();
      if (!t || t.length > 80) continue;
      const n = normalize(t);
      if (n === "contatos" || n === "contacts" || n === "contacto") continue;
      if (/^\+?\d/.test(t)) continue;
      if (n === "indisponível" || n === "unavailable") continue;
      return t;
    }
    return null;
  }

  async function apiLookup(phoneDigits) {
    const accountId = resolvedAccountId();
    const params = new URLSearchParams({
      key: CFG.EMBED_KEY,
      account_id: accountId,
      phone: phoneDigits,
    });
    const res = await fetch(CFG.API_BASE + "/embed/chatwoot/crm/lookup?" + params, {
      headers: { "x-chatwoot-mirror-key": CFG.EMBED_KEY },
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || "Erro " + res.status);
    }
    return res.json();
  }

  async function apiPromote(phoneDigits, name) {
    const accountId = resolvedAccountId();
    const params = new URLSearchParams({
      key: CFG.EMBED_KEY,
      account_id: accountId,
    });
    const res = await fetch(CFG.API_BASE + "/embed/chatwoot/crm/promote?" + params, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-chatwoot-mirror-key": CFG.EMBED_KEY,
      },
      body: JSON.stringify({ phone: phoneDigits, name: name || undefined }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || "Erro " + res.status);
    }
    return res.json();
  }

  function renderSidebarBox(box) {
    const color = brandColor();
    if (crm.loading) {
      box.innerHTML = '<p>Consultando CRM…</p>';
      return;
    }
    if (crm.error) {
      box.innerHTML =
        '<p style="color:#b91c1c">' + crm.error + "</p>" +
        '<button type="button" class="boom-ia-crm-btn boom-ia-crm-btn-ghost" data-action="retry">Tentar novamente</button>';
      on(box.querySelector('[data-action="retry"]'), "click", () => void refreshCrm());
      return;
    }
    if (crm.state === "client" && crm.contactId) {
      box.innerHTML =
        '<span class="boom-ia-crm-badge">Cliente no CRM</span>' +
        '<p style="margin-top:8px">Cadastro vinculado ao telefone deste contato.</p>' +
        '<button type="button" class="boom-ia-crm-btn boom-ia-crm-btn-primary" data-action="open" style="background:' +
        color +
        ';margin-top:4px">Abrir cadastro do cliente</button>';
      on(box.querySelector('[data-action="open"]'), "click", () => openClientPanel(crm.contactId));
      return;
    }
    if (!crm.phoneDigits) {
      box.innerHTML = "<p>Telefone não identificado neste contato.</p>";
      return;
    }
    box.innerHTML =
      '<p>' +
      (crm.state === "lead"
        ? "Lead no CRM — promova para liberar o cadastro completo."
        : "Este contato ainda não é cliente no CRM.") +
      "</p>" +
      '<button type="button" class="boom-ia-crm-btn boom-ia-crm-btn-primary" data-action="promote" style="background:' +
      color +
      '">' +
      (crm.promoting ? "Convertendo…" : "Transformar em cliente") +
      "</button>";
    const btn = box.querySelector('[data-action="promote"]');
    if (btn) on(btn, "click", () => void handlePromote());
  }

  function injectSidebarCta() {
    const sidebar = findContactSidebar();
    if (!sidebar) return false;
    ensureStyles();
    let box = $("#boom-ia-crm-sidebar-box");
    if (box && !sidebar.contains(box)) {
      box.remove();
      box = null;
    }
    if (!box) {
      box = document.createElement("div");
      box.id = "boom-ia-crm-sidebar-box";
      box.className = "boom-ia-crm-box";
      const anchor = findSidebarInjectionPoint(sidebar);
      if (anchor && anchor.parentElement) {
        anchor.parentElement.insertBefore(box, anchor);
      } else {
        sidebar.prepend(box);
      }
    }
    renderSidebarBox(box);
    return true;
  }

  function removeChatBar() {
    $("#boom-ia-crm-chat-bar")?.remove();
  }

  function injectChatBar() {
    if (crm.state !== "client" || !crm.contactId) {
      removeChatBar();
      return;
    }
    const anchor = findChatHeaderAnchor();
    if (!anchor) return;
    ensureStyles();
    let bar = $("#boom-ia-crm-chat-bar");
    if (!bar) {
      bar = document.createElement("div");
      bar.id = "boom-ia-crm-chat-bar";
      anchor.insertAdjacentElement("afterend", bar);
    }
    const color = brandColor();
    bar.innerHTML =
      '<button type="button" class="boom-ia-crm-btn boom-ia-crm-btn-primary" data-action="open" style="background:' +
      color +
      ';width:auto;padding:6px 14px;">Abrir cadastro do cliente</button>' +
      (crm.contactName ? '<span style="font-size:12px;color:var(--color-body,#6b7280)">' + crm.contactName + "</span>" : "");
    on(bar.querySelector('[data-action="open"]'), "click", () => openClientPanel(crm.contactId));
  }

  function measureContactSidebarWidth() {
    const sidebar = findContactSidebar();
    if (!sidebar) return 400;
    const r = sidebar.getBoundingClientRect();
    const w = Math.round(r.width);
    if (!w || w < 280) return 400;
    return Math.min(520, Math.max(320, w));
  }

  function applyPanelWidth() {
    if (!panel) return;
    panel.style.width =
      window.innerWidth <= CFG.MOBILE_MAX_WIDTH ? "100vw" : measureContactSidebarWidth() + "px";
  }

  function postThemeToCrmEmbed() {
    const iframe = panel && panel.querySelector("iframe");
    if (!iframe || !iframe.contentWindow) return;
    try {
      iframe.contentWindow.postMessage({ type: "boom-ia-embed:theme", theme: detectTheme() }, "*");
    } catch (_) {}
  }

  function buildClientIframeUrl(contactId) {
    const accountId = resolvedAccountId();
    const params = new URLSearchParams({
      key: CFG.EMBED_KEY,
      account_id: accountId,
      contact_id: contactId,
      theme: detectTheme(),
    });
    const reactBase = (CFG.EMBED_CLIENT_URL || CFG.BOOM_URL + "/embed/chatwoot/client").replace(/\/+$/, "");
    const htmlBase = (CFG.EMBED_CLIENT_VIEW_URL || CFG.API_BASE + "/embed/chatwoot/crm/view").replace(/\/+$/, "");
    const viewBase = CFG.USE_REACT_EMBED !== false ? reactBase : htmlBase;
    return viewBase + "?" + params.toString();
  }

  function detectTheme() {
    const html = document.documentElement;
    if (html.classList.contains("dark") || document.body.classList.contains("dark")) return "dark";
    if (html.getAttribute("data-theme") === "dark" || document.body.getAttribute("data-theme") === "dark") return "dark";
    return "light";
  }

  function closeClientPanel() {
    if (panel) {
      panel.remove();
      panel = null;
    }
    document.documentElement.classList.remove("boom-ia-crm-open");
    document.body.style.overflow = "";
  }

  function openClientPanel(contactId) {
    if (!contactId) return;
    ensureStyles();
    closeClientPanel();
    panel = document.createElement("div");
    panel.id = "boom-ia-crm-panel";
    panel.innerHTML =
      '<div id="boom-ia-crm-panel-header">' +
      '<strong style="font-size:14px">Cadastro do cliente</strong>' +
      '<button type="button" id="boom-ia-crm-panel-close" style="border:0;background:transparent;font-size:20px;cursor:pointer;line-height:1">×</button>' +
      "</div>" +
      '<iframe id="boom-ia-crm-iframe" title="CRM Cliente" src="' +
      buildClientIframeUrl(contactId) +
      '"></iframe>';
    document.body.appendChild(panel);
    applyPanelWidth();
    document.documentElement.classList.add("boom-ia-crm-open");
    document.body.style.overflow = "hidden";
    on($("#boom-ia-crm-panel-close"), "click", closeClientPanel);
    const iframe = $("#boom-ia-crm-iframe");
    if (iframe) {
      on(iframe, "load", postThemeToCrmEmbed);
      setTimeout(postThemeToCrmEmbed, 600);
    }
  }

  async function handlePromote() {
    if (!crm.phoneDigits || crm.promoting) return;
    crm.promoting = true;
    crm.error = null;
    injectSidebarCta();
    try {
      const res = await apiPromote(crm.phoneDigits, crm.contactName);
      crm.state = "client";
      crm.contactId = res.contact?.id || null;
      crm.contactName = res.contact?.name || crm.contactName;
    } catch (e) {
      crm.error = e.message || "Falha ao converter";
    } finally {
      crm.promoting = false;
      injectSidebarCta();
      injectChatBar();
    }
  }

  async function refreshCrm() {
    if (!isScopeAllowed() || !isConversationView()) return;

    const convKey = getConversationIdFromPath() || routeText();
    if (convKey !== lastConversationKey) {
      lastConversationKey = convKey;
      crm.state = null;
      crm.contactId = null;
      crm.phoneDigits = null;
      crm.error = null;
      removeChatBar();
    }

    const sidebar = findContactSidebar();
    if (!sidebar) return;

    const phone = extractPhoneDigits(sidebar);
    const name = extractContactName(sidebar);
    if (!phone) {
      crm.phoneDigits = null;
      crm.loading = false;
      injectSidebarCta();
      removeChatBar();
      return;
    }

    if (phone === crm.phoneDigits && crm.state && !crm.error) {
      injectSidebarCta();
      injectChatBar();
      return;
    }

    crm.phoneDigits = phone;
    crm.contactName = name;
    crm.loading = true;
    crm.error = null;
    injectSidebarCta();

    try {
      const res = await apiLookup(phone);
      crm.state = res.state;
      crm.contactId = res.contact?.id || null;
      if (res.contact?.name) crm.contactName = res.contact.name;
    } catch (e) {
      crm.error = e.message || "Falha ao consultar CRM";
      crm.state = null;
      crm.contactId = null;
    } finally {
      crm.loading = false;
      injectSidebarCta();
      injectChatBar();
    }
  }

  function scheduleRefresh() {
    clearTimeout(lookupTimer);
    lookupTimer = setTimeout(() => void refreshCrm(), 320);
  }

  function cleanup() {
    $("#boom-ia-crm-sidebar-box")?.remove();
    removeChatBar();
    closeClientPanel();
    lastConversationKey = null;
    crm.loading = false;
    crm.promoting = false;
    crm.state = null;
    crm.contactId = null;
    crm.phoneDigits = null;
    crm.error = null;
  }

  function scheduleCleanup() {
    clearTimeout(cleanupTimer);
    cleanupTimer = setTimeout(() => {
      if (!isConversationView()) cleanup();
    }, 900);
  }

  function apply() {
    if (!isScopeAllowed()) {
      cleanup();
      return;
    }
    if (!isConversationView()) {
      scheduleCleanup();
      return;
    }
    clearTimeout(cleanupTimer);
    scheduleRefresh();
  }

  function scheduleApply() {
    clearTimeout(applyTimer);
    applyTimer = setTimeout(apply, 120);
  }

  function hookSpaNavigation() {
    const wrap = (fn) =>
      function () {
        const ret = fn.apply(this, arguments);
        scheduleApply();
        return ret;
      };
    if (!history.__boomIaCrmPatched) {
      history.__boomIaCrmPatched = true;
      history.pushState = wrap(history.pushState);
      history.replaceState = wrap(history.replaceState);
    }
  }

  const observer = new MutationObserver(scheduleApply);
  observer.observe(document.documentElement, { childList: true, subtree: true });

  hookSpaNavigation();
  on(window, "popstate", scheduleApply);
  on(window, "hashchange", scheduleApply);
    on(window, "resize", () => {
      applyPanelWidth();
      postThemeToCrmEmbed();
      scheduleApply();
    });
  setInterval(scheduleApply, 2500);

  apply();
})();
</script>
