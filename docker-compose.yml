# Boom IA - Docker Compose (frontend + server + proxy)
# Acesse: http://localhost (frontend em /, API em /api)
#
# No Portainer: defina as variáveis na stack (Environment variables).
# Não use env_file: o Portainer não tem .env no diretório do clone.

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      - PORT=${PORT:-3001}
      - NODE_ENV=${NODE_ENV:-production}
      - NEXUS_DB_URL=${NEXUS_DB_URL}
      - NEXUS_SERVICE_ROLE_KEY=${NEXUS_SERVICE_ROLE_KEY}
      - NEXUS_DB_ANON_KEY=${NEXUS_DB_ANON_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - API_BASE_URL=${API_BASE_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
      - frontend
    restart: unless-stopped
