# Proxy reverso: / -> frontend, /api -> servidor Node
# Acesse pelo domínio (ex.: ia.agboom.com.br) com DNS apontando para o IP da VPS
# Resolver em tempo de requisição evita "host not found in upstream" quando o proxy sobe antes do server/frontend (Swarm).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name ia.agboom.com.br localhost;

    # Headers para o app saber o host e se a requisição veio por HTTPS (quando houver proxy SSL na frente)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API do servidor (Fastify na porta 3001) — variável para resolver em tempo de requisição
    location /api/ {
        set $backend "http://server:3001";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health do servidor (opcional)
    location /health {
        set $backend "http://server:3001";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Frontend (React) — variável para resolver em tempo de requisição
    location / {
        set $frontend "http://frontend:80";
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
