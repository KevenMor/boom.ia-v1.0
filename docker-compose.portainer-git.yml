# Boom IA - Stack para Portainer com deploy por GIT
# Use este arquivo se você quer que o Portainer clone o repositório e faça build.
#
# No Portainer:
#   1. Stacks > Add stack > Git repository
#   2. Repository URL: https://github.com/KevenMor/boom-agents.git
#   3. Repository reference: main
#   4. Compose path: docker-compose.portainer-git.yml
#   5. Repository authentication:
#      - Username: KevenMor
#      - Password: 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
#   6. Environment variables: cole as variáveis do .env.stack (sem GITHUB_*)
#   7. Deploy the stack
#
# Porta: 8081 (evita conflito com Traefik)

version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: boom-ia-server:latest
    environment:
      - PORT=${PORT:-3001}
      - NODE_ENV=${NODE_ENV:-production}
      - NEXUS_DB_URL=${NEXUS_DB_URL}
      - NEXUS_SERVICE_ROLE_KEY=${NEXUS_SERVICE_ROLE_KEY}
      - NEXUS_DB_ANON_KEY=${NEXUS_DB_ANON_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - API_BASE_URL=${API_BASE_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - INTERNAL_API_INSECURE_TLS=${INTERNAL_API_INSECURE_TLS:-true}
      - WAHA_BASE_URL=${WAHA_BASE_URL:-https://waha.atendai.app}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - AS_VEICULOS_WAHA_SESSION=${AS_VEICULOS_WAHA_SESSION:-20_71_5515996809008}
      - AS_VEICULOS_WAHA_LABELS_WEBHOOK_SECRET=${AS_VEICULOS_WAHA_LABELS_WEBHOOK_SECRET}
      - AS_VEICULOS_MEGA_ACCOUNT_ID=${AS_VEICULOS_MEGA_ACCOUNT_ID:-20}
      - AS_VEICULOS_MEGA_INBOX_ID=${AS_VEICULOS_MEGA_INBOX_ID:-71}
      - AS_VEICULOS_CHATWOOT_TOKEN=${AS_VEICULOS_CHATWOOT_TOKEN}
      - CHATWOOT_BASE_URL=${CHATWOOT_BASE_URL:-https://mega.atendai.app}
    networks:
      - boom_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
        VITE_API_URL: ${VITE_API_URL}
    image: boom-ia-frontend:latest
    networks:
      - boom_network

  proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile.proxy
    image: boom-ia-proxy:latest
    ports:
      - target: 80
        published: 8081
        protocol: tcp
    networks:
      - boom_network

networks:
  boom_network:
    driver: overlay
    attachable: true
