# Boom IA - Stack para Portainer com deploy por GIT + Traefik
# Use este arquivo se você quer que o Portainer clone o repositório e faça build.
#
# No Portainer:
#   1. Stacks > Add stack > Git repository
#   2. Repository URL: https://github.com/KevenMor/boom.ia-v1.0
#   3. Repository reference: main
#   4. Compose path: docker-compose.portainer-git-traefik.yml
#   5. Repository authentication:
#      - Username: KevenMor
#      - Password: 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
#   6. Environment variables: cole as variáveis abaixo
#   7. Deploy the stack
#
# Variáveis necessárias:
# - PORT=3001
# - NODE_ENV=production
# - NEXUS_DB_URL=https://boomsolution-supabase.kgn6uc.easypanel.host
# - NEXUS_SERVICE_ROLE_KEY=<sua_service_role_key>
# - NEXUS_DB_ANON_KEY=<sua_anon_key>
# - ENCRYPTION_KEY=<sua_encryption_key_32_chars>
# - API_BASE_URL=https://ia.agboom.com.br
# - CORS_ORIGINS=https://ia.agboom.com.br
# - OPENAI_API_KEY=<sua_openai_key>
# - GEMINI_API_KEY=<sua_gemini_key>
# - INTERNAL_API_INSECURE_TLS=true
# - VITE_SUPABASE_URL=https://boomsolution-supabase.kgn6uc.easypanel.host
# - VITE_SUPABASE_PUBLISHABLE_KEY=<sua_anon_key>
# - VITE_SUPABASE_PROJECT_ID=default
# - VITE_API_URL=https://ia.agboom.com.br/api

version: '3.8'

networks:
  internal:
    driver: overlay
  minha_rede:
    external: true

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: boom-ia-server:latest
    environment:
      - PORT=${PORT:-3001}
      - NODE_ENV=${NODE_ENV:-production}
      - NEXUS_DB_URL=${NEXUS_DB_URL}
      - NEXUS_SERVICE_ROLE_KEY=${NEXUS_SERVICE_ROLE_KEY}
      - NEXUS_DB_ANON_KEY=${NEXUS_DB_ANON_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - API_BASE_URL=${API_BASE_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - INTERNAL_API_INSECURE_TLS=${INTERNAL_API_INSECURE_TLS:-true}
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: start-first
        failure_action: rollback

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
        VITE_API_URL: ${VITE_API_URL}
    image: boom-ia-frontend:latest
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile.proxy
    image: boom-ia-proxy:latest
    networks:
      - internal
      - minha_rede
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        # Traefik: ia.agboom.com.br -> proxy:80 (rede minha_rede = rede do Traefik na VPS)
        - "traefik.enable=true"
        - "traefik.docker.network=minha_rede"
        - "traefik.http.routers.boom-ia.rule=Host(`ia.agboom.com.br`)"
        - "traefik.http.routers.boom-ia.entrypoints=web,websecure"
        - "traefik.http.routers.boom-ia.tls=true"
        - "traefik.http.routers.boom-ia.tls.certresolver=letsencrypt"
        - "traefik.http.services.boom-ia.loadbalancer.server.port=80"
