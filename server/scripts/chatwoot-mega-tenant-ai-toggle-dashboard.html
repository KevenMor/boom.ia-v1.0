<!--
  Boom — Dashboard Script (Mega / Chatwoot): controle global de IA por tenant
  ---------------------------------------------------------------------------
  1. CFG.API_BASE_URL = URL pública HTTPS da API (nunca http://localhost se o Mega for HTTPS).
  2. Servidor .env: TENANT_AI_TOGGLE_SECRET + UMA destas para CORS:
     TENANT_AI_TOGGLE_CORS_ORIGINS=https://exato-do-mega.com
     ou padrão wildcard: TENANT_AI_TOGGLE_CORS_ORIGINS=*.seudominio.com
     ou (só teste): TENANT_AI_TOGGLE_CORS_REFLECT=true
  3. Cola SÓ o bloco <script>...</script> em Super Admin → Dashboard Scripts → Guardar.
  4. UI_MODE: "modal" (padrão) = janela centrada + backdrop; "new_tab" = separador; "overlay" = painel lateral.
  5. ACCOUNT_SCOPE: só injeta no Mega nas contas listadas; tenant Boom por account_id (ex. /app/accounts/9/ → PPL Motors).
-->
<script>
(function () {
  'use strict';

  /** ========== CONFIGURAÇÃO (obrigatório preencher) ========== */
  const CFG = {
    /**
     * URL base da API Boom (SEM /api no fim).
     * Mega em HTTPS + API em http://localhost = o browser bloqueia (mixed content ou CORS).
     * Em produção: URL pública HTTPS (ex. https://api.teudominio.com) + TENANT_AI_TOGGLE_CORS_ORIGINS no .env.
     */
    API_BASE_URL: 'http://localhost:3001',
    /** Fallback; com ACCOUNT_SCOPE ativo o TENANT_ID é sobrescrito pelo mapa. */
    TENANT_ID: 'bc4a1dc9-a205-4b4b-9b6c-47bf677a2728',
    TOGGLE_SECRET: '12345678910',

    /**
     * Mega: /app/accounts/9/... → só esta instalação Boom (tenant PPL Motors / ia.agboom).
     * Em outros account_id o script termina logo (sem item na sidebar).
     */
    ACCOUNT_SCOPE: {
      allowedAccountIds: [9],
      tenantByAccountId: {
        9: 'bc4a1dc9-a205-4b4b-9b6c-47bf677a2728',
      },
    },

    LINK_TEXT: 'IA Global',
    LINK_ICON: '🤖',
    /** Tenta cada texto até encontrar um <li> na sidebar (PT/EN). */
    POSITION: { mode: 'afterLabel', labels: ['Conversas', 'Conversations'], index: 0 },
    PANEL_TITLE: 'Controle de IA (organização)',
    PADDING: 16,
    SHOW_BORDER: true,
    /**
     * "modal" = janela centrada com backdrop (recomendado, mesmo visual do cartão)
     * "new_tab" = novo separador | "overlay" = painel lateral antigo
     */
    UI_MODE: 'modal',
  };

  function megaAccountIdFromPath() {
    const m = String(window.location.pathname || '').match(/\/accounts\/(\d+)/);
    return m ? Number(m[1]) : null;
  }

  /** Aplica tenant por conta Mega; se allowedAccountIds e o URL não bater, não carrega o script. */
  function applyMegaAccountScope() {
    const s = CFG.ACCOUNT_SCOPE;
    if (!s) return true;
    const aid = megaAccountIdFromPath();
    if (s.tenantByAccountId && aid != null) {
      const tid = s.tenantByAccountId[aid] ?? s.tenantByAccountId[String(aid)];
      if (tid) CFG.TENANT_ID = String(tid);
    }
    if (s.allowedAccountIds && s.allowedAccountIds.length) {
      if (aid == null || !s.allowedAccountIds.includes(aid)) return false;
    }
    return true;
  }

  if (!applyMegaAccountScope()) return;

  const $ = (s, r) => {
    try {
      return (r || document).querySelector(s);
    } catch {
      return null;
    }
  };
  const $$ = (s, r) => {
    try {
      return Array.from((r || document).querySelectorAll(s));
    } catch {
      return [];
    }
  };
  const on = (el, ev, fn, opts) => el && el.addEventListener(ev, fn, opts || { passive: true });
  const normalize = (s) => (s || '').toLowerCase().replace(/\s+/g, ' ').trim();

  function apiBase() {
    return String(CFG.API_BASE_URL || '').replace(/\/+$/, '');
  }

  function isUuidConfigured() {
    return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(CFG.TENANT_ID || '');
  }

  function positionLabels() {
    const p = CFG.POSITION || {};
    if (Array.isArray(p.labels) && p.labels.length) return p.labels;
    if (p.label) return [p.label];
    return ['Conversas', 'Conversations'];
  }

  function findSidebarInsertRef() {
    for (const lab of positionLabels()) {
      const found = findListAndRefByLabel(lab);
      if (found.list && found.ref) return found;
    }
    return { list: null, ref: null };
  }

  /** Devolve mensagem PT se houver bloqueio óbvio antes do fetch. */
  function networkPrecheck() {
    const base = apiBase();
    if (!base) return 'Define CFG.API_BASE_URL (URL da API Boom, sem /api).';
    try {
      const apiU = new URL(base.startsWith('http') ? base : 'https://' + base);
      const pageU = new URL(window.location.href);
      if (pageU.protocol === 'https:' && apiU.protocol === 'http:') {
        return (
          'Esta página é HTTPS mas a API está em HTTP — o browser bloqueia (mixed content). ' +
          'Usa API_BASE_URL com https:// (URL pública do mesmo servidor Boom).'
        );
      }
    } catch {
      return 'API_BASE_URL inválida.';
    }
    return null;
  }

  function explainFetchError(err) {
    const msg = (err && err.message) || String(err);
    if (/Failed to fetch|NetworkError|Load failed|network/i.test(msg)) {
      return (
        msg +
        '\n\nProváveis causas:\n' +
        '1) CORS: no servidor Boom, define TENANT_AI_TOGGLE_CORS_ORIGINS com o valor EXATO de "Origem" abaixo ' +
        '(ou CORS_ORIGINS=... ou TENANT_AI_TOGGLE_CORS_REFLECT=true só para testes).\n' +
        '2) URL da API errada / servidor offline / certificado SSL inválido.\n' +
        '3) HTTPS no Mega + API em http://localhost (bloqueado).'
      );
    }
    return msg;
  }

  function isOverlayMode() {
    return CFG.UI_MODE === 'overlay';
  }

  function isNewTabMode() {
    return CFG.UI_MODE === 'new_tab';
  }

  /** Mesmos padrões visuais do cartão standalone, limitados ao modal. */
  const MODAL_CARD_CSS = `
    #boom-ia-modal-scrim * { box-sizing: border-box; }
    #boom-ia-modal-scrim {
      position: fixed; inset: 0; z-index: 100000; display: none; align-items: center; justify-content: center;
      padding: 24px 16px 32px; overflow-y: auto; background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(4px);
    }
    #boom-ia-modal-scrim .boom-ia-modal-page {
      width: 100%; max-width: 460px; margin: auto; min-height: min-content;

      background: transparent; padding: 8px 4px; box-shadow: none; pointer-events: auto;
    }
    #boom-ia-modal-scrim .card {
      width: 100%; max-width: 440px; margin: 0 auto;
      border: 1px solid rgba(148, 163, 184, 0.28); border-radius: 18px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.06) inset;
      padding: 26px 24px 22px; backdrop-filter: blur(12px);
      background: linear-gradient(165deg, rgba(255, 255, 255, 0.98) 0%, rgba(248, 250, 252, 0.98) 50%, rgba(236, 253, 245, 0.95) 100%);
    }
    @media (prefers-color-scheme: dark) {
      #boom-ia-modal-scrim .card {
        background: rgba(30, 41, 59, 0.94) !important; border-color: rgba(148, 163, 184, 0.22) !important;
      }
    }
    #boom-ia-modal-scrim .brand { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #4f46e5; margin-bottom: 6px; }
    #boom-ia-modal-scrim h1 { margin: 0 0 10px; font-size: 1.45rem; font-weight: 700; line-height: 1.25; letter-spacing: -0.02em; }
    #boom-ia-modal-scrim .lead { margin: 0 0 18px; font-size: 0.875rem; line-height: 1.55; color: #64748b; }
    @media (prefers-color-scheme: dark) { #boom-ia-modal-scrim .lead { color: #94a3b8; } }
    #boom-ia-modal-scrim .diag {
      font-size: 11px; line-height: 1.5; padding: 12px 14px; border-radius: 12px; border: 1px solid #bae6fd; background: #f0f9ff;

    }
    @media (prefers-color-scheme: dark) {
      #boom-ia-modal-scrim .diag { background: rgba(14, 165, 233, 0.14); border-color: rgba(125, 211, 252, 0.35); }
    }
    #boom-ia-modal-scrim .status {
      border-radius: 12px; padding: 14px 16px; font-size: 0.95rem; font-weight: 600; margin-bottom: 16px;
      background: rgba(241, 245, 249, 0.95); border-left: 4px solid #94a3b8; white-space: pre-wrap; line-height: 1.45;
    }
    @media (prefers-color-scheme: dark) { #boom-ia-modal-scrim .status { background: rgba(15, 23, 42, 0.5); } }
    #boom-ia-modal-scrim .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    #boom-ia-modal-scrim .btn {
      cursor: pointer; padding: 11px 18px; border-radius: 11px; border: none; font-weight: 600; font-size: 0.9rem; font-family: inherit;
      transition: transform 0.07s ease, box-shadow 0.12s ease;
    }
    #boom-ia-modal-scrim .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    #boom-ia-modal-scrim .btn:active:not(:disabled) { transform: scale(0.98); }
    #boom-ia-modal-scrim .btn.on { background: linear-gradient(180deg, #22c55e, #15803d); color: #fff; box-shadow: 0 4px 16px rgba(22, 163, 74, 0.38); }
    #boom-ia-modal-scrim .btn.off { background: linear-gradient(180deg, #f97316, #9a3412); color: #fff; box-shadow: 0 4px 16px rgba(234, 88, 12, 0.32); }
    #boom-ia-modal-scrim .btn.ghost { background: transparent; color: inherit; border: 1px solid rgba(100, 116, 139, 0.5); }
    #boom-ia-modal-scrim .btn-x {
      cursor: pointer; width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(148, 163, 184, 0.45);
      background: transparent; color: inherit; font-size: 1.25rem; line-height: 1; flex-shrink: 0;
    }
    #boom-ia-modal-scrim .foot { font-size: 11px; margin: 0; opacity: 0.8; line-height: 1.5; }
  `;

  const STANDALONE_PAGE_CSS = `
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(165deg, #e0e7ff 0%, #f8fafc 42%, #ecfdf5 100%); color: #0f172a; }
    @media (prefers-color-scheme: dark) {
      body { background: linear-gradient(165deg, #1e1b4b 0%, #0f172a 48%, #14532d 100%); color: #f1f5f9; }
      .card { background: rgba(30, 41, 59, 0.94) !important; border-color: rgba(148, 163, 184, 0.22) !important; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45) !important; }
    }
    .page { min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 36px 16px 56px; }
    .card { width: 100%; max-width: 440px; background: rgba(255, 255, 255, 0.96); border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.2); padding: 30px 28px 26px; backdrop-filter: blur(10px); }
    .brand { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #4f46e5; margin-bottom: 8px; }
    h1 { margin: 0 0 12px; font-size: 1.5rem; font-weight: 700; line-height: 1.25; letter-spacing: -0.02em; }
    .lead { margin: 0 0 20px; font-size: 0.875rem; line-height: 1.55; color: #64748b; }
    @media (prefers-color-scheme: dark) { .lead { color: #94a3b8; } }
    .diag { font-size: 11px; line-height: 1.5; padding: 12px 14px; border-radius: 12px; border: 1px solid #bae6fd; background: #f0f9ff;
      font-family: ui-monospace, SFMono-Regular, monospace; white-space: pre-wrap; word-break: break-all; margin: 0 0 16px; }
    @media (prefers-color-scheme: dark) { .diag { background: rgba(14, 165, 233, 0.14); border-color: rgba(125, 211, 252, 0.35); } }
    .status { border-radius: 12px; padding: 14px 16px; font-size: 0.95rem; font-weight: 600; margin-bottom: 18px;
      background: rgba(241, 245, 249, 0.95); border-left: 4px solid #94a3b8; white-space: pre-wrap; line-height: 1.45; }
    @media (prefers-color-scheme: dark) { .status { background: rgba(15, 23, 42, 0.5); } }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .btn { cursor: pointer; padding: 11px 18px; border-radius: 11px; border: none; font-weight: 600; font-size: 0.9rem; font-family: inherit;
      transition: transform 0.07s ease, box-shadow 0.12s ease; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn.on { background: linear-gradient(180deg, #22c55e, #15803d); color: #fff; box-shadow: 0 4px 16px rgba(22, 163, 74, 0.38); }
    .btn.off { background: linear-gradient(180deg, #f97316, #9a3412); color: #fff; box-shadow: 0 4px 16px rgba(234, 88, 12, 0.32); }
    .btn.ghost { background: transparent; color: inherit; border: 1px solid rgba(100, 116, 139, 0.5); }
    .foot { font-size: 11px; margin: 0; opacity: 0.8; line-height: 1.5; }
  `;

  function escapeHtmlDoc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  const STANDALONE_APP_JS =
    "(function(){" +
    "var K='__boom_tenant_ia_cfg_v1';" +
    "var raw=sessionStorage.getItem(K);sessionStorage.removeItem(K);" +
    "var h1=document.getElementById('h1');var st=document.getElementById('st');" +
    "if(!raw){if(h1)h1.textContent='IA Global';if(st)st.textContent='Abre esta página pelo menu «IA Global» no Mega.';return;}" +
    "var CFG=JSON.parse(raw);" +
    "function apiBase(){return String(CFG.API_BASE_URL||'').replace(/\\/+$/, '');}" +
    "function pre(){var b=apiBase();if(!b)return 'Define API_BASE_URL no script do Mega.';try{var a=new URL(b.indexOf('http')===0?b:'https://'+b);var p=new URL(location.href);" +
    "if(p.protocol==='https:'&&a.protocol==='http:')return 'Esta página é HTTPS mas a API está em HTTP (mixed content). Usa uma API em https://.';}catch(e){return 'API_BASE_URL inválida.';}return null;}" +
    "function ex(e){var m=(e&&e.message)||String(e);if(/Failed to fetch|NetworkError|Load failed/i.test(m))return m+'\\n\\nCORS: no servidor Node, TENANT_AI_TOGGLE_CORS_ORIGINS='+location.origin;return m;}" +
    "function apiF(path,opts){var e=pre();if(e)return Promise.reject(new Error(e));" +
    "var url=apiBase()+'/api'+path;var h=Object.assign({'x-tenant-ai-toggle-secret':CFG.TOGGLE_SECRET,'Accept':'application/json'},(opts&&opts.headers)||{});" +
    "return fetch(url,Object.assign({credentials:'omit',mode:'cors'},opts||{},{headers:h})).then(function(r){" +
    "return r.text().then(function(t){var j={};try{j=t?JSON.parse(t):{}}catch(x){j={raw:t}}" +
    "if(!r.ok){var err=j.error||j.message||t||r.statusText;throw new Error(typeof err==='string'?err:JSON.stringify(err));}return j;});}).catch(function(e){throw new Error(ex(e));});}" +
    "function load(){if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(CFG.TENANT_ID||''))return Promise.reject(new Error('TENANT_ID inválido'));" +
    "return apiF('/tenant-ai/status?tenant_id='+encodeURIComponent(CFG.TENANT_ID),{method:'GET'});}" +
    "function togg(en){return apiF('/tenant-ai/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenant_id:CFG.TENANT_ID,enabled:!!en})});}" +
    "function paintD(ok){var d=document.getElementById('diag');if(!d)return;d.style.borderColor=ok?'#7dd3fc':'#fca5a5';d.style.background=ok?'#f0f9ff':'#fef2f2';" +
    "if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){d.style.background=ok?'rgba(14,165,233,.14)':'rgba(248,113,113,.12)';}" +
    "d.textContent='Origem: '+location.origin+'\\nAPI: '+apiBase()+'/api/tenant-ai/\\n.env TENANT_AI_TOGGLE_CORS_ORIGINS='+location.origin;}" +
    "function refresh(){var ft=document.getElementById('foot');st.textContent='A carregar…';st.style.borderLeftColor='#94a3b8';st.style.color='#64748b';if(ft)ft.textContent='';paintD(true);" +
    "return load().then(function(j){var on=j.ai_globally_enabled!==false;st.textContent=on?'Estado: IA global LIGADA':'Estado: IA global DESLIGADA';" +
    "st.style.borderLeftColor=on?'#22c55e':'#ea580c';st.style.color=on?'#166534':'#c2410c';if(ft)ft.textContent='tenant_id: '+(CFG.TENANT_ID||'').slice(0,8)+'…';}).catch(function(e){st.textContent='Erro: '+((e&&e.message)||String(e));st.style.borderLeftColor='#ef4444';st.style.color='#b91c1c';paintD(false);if(ft)ft.textContent='Reinicia o Node após alterar .env.';});}" +
    "function toast(msg,ok){var x=document.getElementById('toast');if(!x){x=document.createElement('div');x.id='toast';x.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:999px;font:14px system-ui,sans-serif;color:#fff;z-index:9999;box-shadow:0 12px 40px rgba(0,0,0,.2);';document.body.appendChild(x);}" +
    "x.style.background=ok?'#15803d':'#b91c1c';x.textContent=msg;x.style.display='block';clearTimeout(x._t);x._t=setTimeout(function(){x.style.display='none'},4200);}" +
    "h1.textContent=CFG.PANEL_TITLE||'IA Global';" +
    "document.getElementById('b-ref').addEventListener('click',function(){refresh();});" +
    "document.getElementById('b-on').addEventListener('click',function(){var a=this,b=document.getElementById('b-off');a.disabled=b.disabled=true;" +
    "togg(true).then(function(){toast('IA global ligada.',true);return refresh();}).catch(function(e){toast((e&&e.message)||String(e),false);}).finally(function(){a.disabled=b.disabled=false;});});" +
    "document.getElementById('b-off').addEventListener('click',function(){var a=this,b=document.getElementById('b-on');a.disabled=b.disabled=true;" +
    "togg(false).then(function(){toast('IA global desligada.',true);return refresh();}).catch(function(e){toast((e&&e.message)||String(e),false);}).finally(function(){a.disabled=b.disabled=false;});});" +
    "refresh();" +
    "})();";

  function buildStandaloneDocument() {
    const title = escapeHtmlDoc(CFG.PANEL_TITLE || 'IA Global');
    return `<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title}</title><style>${STANDALONE_PAGE_CSS}</style></head><body><div class="page"><div class="card" id="root"><div class="brand">Boom</div><h1 id="h1"></h1><p class="lead">Controla a IA para <strong>toda</strong> a organização (todos os agentes e webhooks desta tenant).</p><pre id="diag" class="diag"></pre><div id="st" class="status">A abrir…</div><div class="row"><button type="button" class="btn on" id="b-on">Ligar IA (global)</button><button type="button" class="btn off" id="b-off">Desligar IA (global)</button><button type="button" class="btn ghost" id="b-ref">Atualizar</button></div><p class="foot" id="foot"></p></div></div><script>${STANDALONE_APP_JS}<\/script></body></html>`;
  }

  function openStandaloneTenantIaPage() {
    const key = '__boom_tenant_ia_cfg_v1';
    try {
      sessionStorage.setItem(key, JSON.stringify(CFG));
    } catch (e) {
      toast('Não foi possível guardar a configuração (sessionStorage).', false);
      return;
    }
    const w = window.open('', '_blank');
    if (!w) {
      try {
        sessionStorage.removeItem(key);
      } catch (_) {}
      toast('Permite pop-ups para este site no browser.', false);
      return;
    }
    try {
      w.document.open();
      w.document.write(buildStandaloneDocument());
      w.document.close();
      w.focus();
    } catch (e) {
      try {
        sessionStorage.removeItem(key);
      } catch (_) {}
      toast('Não foi possível abrir o separador.', false);
    }
  }

  function ensureModalStyle() {
    if ($('#boom-ia-modal-style-tag')) return;
    const st = document.createElement('style');
    st.id = 'boom-ia-modal-style-tag';
    st.textContent = MODAL_CARD_CSS;
    document.head.appendChild(st);
  }

  function modalPaintDiag(ok) {
    const d = $('#boom-ia-m-diag');
    if (!d) return;
    d.style.borderColor = ok ? '#7dd3fc' : '#fca5a5';
    d.style.background = ok ? '#f0f9ff' : '#fef2f2';
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      d.style.background = ok ? 'rgba(14,165,233,.14)' : 'rgba(248,113,113,.12)';
    }
    d.textContent =
      'Origem (cola no servidor): ' +
      window.location.origin +
      '\nAPI: ' +
      apiBase() +
      '/api/tenant-ai/…' +
      '\n.env TENANT_AI_TOGGLE_CORS_ORIGINS=' +
      window.location.origin;
  }

  async function modalRefreshStatus() {
    const st = $('#boom-ia-m-st');
    const foot = $('#boom-ia-m-foot');
    if (!st) return;
    st.textContent = 'A carregar estado…';
    st.style.borderLeftColor = '#94a3b8';
    st.style.color = '#64748b';
    if (foot) foot.textContent = '';
    modalPaintDiag(true);
    try {
      const j = await loadStatus();
      const on = j.ai_globally_enabled !== false;
      st.textContent = on ? 'Estado: IA global LIGADA' : 'Estado: IA global DESLIGADA';
      st.style.borderLeftColor = on ? '#22c55e' : '#ea580c';
      st.style.color = on ? '#166534' : '#c2410c';
      if (foot) foot.textContent = 'tenant_id: ' + (CFG.TENANT_ID || '').slice(0, 8) + '…';
    } catch (e) {
      st.textContent = 'Erro: ' + ((e && e.message) || String(e));
      st.style.borderLeftColor = '#ef4444';
      st.style.color = '#b91c1c';
      modalPaintDiag(false);
      if (foot) foot.textContent = 'Reinicia o Node após alterar .env.';
    }
  }

  function hideTenantIaModal() {
    const scrim = $('#boom-ia-modal-scrim');
    if (scrim) scrim.style.display = 'none';
  }

  function isModalVisible() {
    const s = $('#boom-ia-modal-scrim');
    return !!(s && s.style.display === 'flex');
  }

  function toggleTenantIaModal() {
    if (isModalVisible()) {
      hideTenantIaModal();
      return;
    }
    showTenantIaModal();
  }

  function showTenantIaModal() {
    ensureModalStyle();
    let scrim = $('#boom-ia-modal-scrim');
    if (!scrim) {
      scrim = document.createElement('div');
      scrim.id = 'boom-ia-modal-scrim';
      scrim.setAttribute('role', 'presentation');
      scrim.innerHTML = `
        <div class="boom-ia-modal-page" id="boom-ia-modal-page-inner">
          <div class="card" role="dialog" aria-modal="true" aria-labelledby="boom-ia-m-h1">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px">
              <div class="brand">Boom</div>
              <button type="button" class="btn-x" id="boom-ia-m-close" title="Fechar" aria-label="Fechar">×</button>
            </div>
            <h1 id="boom-ia-m-h1"></h1>
            <p class="lead">Controla a IA para <strong>toda</strong> a organização (todos os agentes e webhooks desta tenant).</p>
            <pre id="boom-ia-m-diag" class="diag"></pre>
            <div id="boom-ia-m-st" class="status">A abrir…</div>
            <div class="row">
              <button type="button" class="btn on" id="boom-ia-m-on">Ligar IA (global)</button>
              <button type="button" class="btn off" id="boom-ia-m-off">Desligar IA (global)</button>
              <button type="button" class="btn ghost" id="boom-ia-m-ref">Atualizar</button>
            </div>
            <p class="foot" id="boom-ia-m-foot"></p>
          </div>
        </div>`;
      document.body.appendChild(scrim);
      on(scrim, 'click', (ev) => {
        if (ev.target === scrim) hideTenantIaModal();
      });
      on($('#boom-ia-m-close'), 'click', (e) => {
        e.stopPropagation();
        hideTenantIaModal();
      });
      on($('#boom-ia-m-ref'), 'click', () => {
        modalRefreshStatus();
      });
      on($('#boom-ia-m-on'), 'click', async () => {
        const a = $('#boom-ia-m-on');
        const b = $('#boom-ia-m-off');
        if (a) a.disabled = true;
        if (b) b.disabled = true;
        try {
          await setEnabled(true);
          toast('IA global ligada.', true);
          await modalRefreshStatus();
        } catch (e) {
          toast((e && e.message) || String(e), false);
        } finally {
          if (a) a.disabled = false;
          if (b) b.disabled = false;
        }
      });
      on($('#boom-ia-m-off'), 'click', async () => {
        const a = $('#boom-ia-m-on');
        const b = $('#boom-ia-m-off');
        if (a) a.disabled = true;
        if (b) b.disabled = true;
        try {
          await setEnabled(false);
          toast('IA global desligada.', true);
          await modalRefreshStatus();
        } catch (e) {
          toast((e && e.message) || String(e), false);
        } finally {
          if (a) a.disabled = false;
          if (b) b.disabled = false;
        }
      });
    }
    scrim.style.display = 'flex';
    const mh = $('#boom-ia-m-h1');
    if (mh) mh.textContent = CFG.PANEL_TITLE || 'IA Global';
    modalRefreshStatus();
  }

  function themeColors() {
    const body = document.body;
    const cs = getComputedStyle(body);
    const bg = cs.backgroundColor || '#f8fafc';
    const fg = cs.color || '#0f172a';
    const muted = fg === '#0f172a' ? '#64748b' : 'rgba(255,255,255,0.65)';
    const border = document.documentElement.classList.contains('dark') || /dark/i.test(body.className)
      ? 'rgba(255,255,255,0.12)'
      : 'rgba(15,23,42,0.12)';
    return { bg, fg, muted, border };
  }

  function toast(msg, ok) {
    let el = $('#boom-ia-toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'boom-ia-toast';
      el.style.cssText =
        'position:fixed;bottom:24px;right:24px;z-index:100001;max-width:360px;padding:12px 16px;border-radius:10px;font:13px/1.4 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.18);';
      document.body.appendChild(el);
    }
    el.style.background = ok ? '#15803d' : '#b91c1c';
    el.style.color = '#fff';
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => {
      el.style.display = 'none';
    }, 5000);
  }

  async function apiFetch(path, opts) {
    const pre = networkPrecheck();
    if (pre) throw new Error(pre);
    const url = apiBase() + '/api' + path;
    const headers = Object.assign(
      {
        'x-tenant-ai-toggle-secret': CFG.TOGGLE_SECRET,
        Accept: 'application/json',
      },
      opts && opts.headers
    );
    let res;
    try {
      res = await fetch(url, Object.assign({ credentials: 'omit', mode: 'cors' }, opts, { headers }));
    } catch (e) {
      throw new Error(explainFetchError(e));
    }
    const text = await res.text();
    let json;
    try {
      json = text ? JSON.parse(text) : {};
    } catch {
      json = { raw: text };
    }
    if (!res.ok) {
      const err = json.error || json.message || text || res.statusText;
      throw new Error(typeof err === 'string' ? err : JSON.stringify(err));
    }
    return json;
  }

  async function loadStatus() {
    if (!isUuidConfigured()) throw new Error('Define CFG.TENANT_ID com o UUID da tenant (SQL).');
    return apiFetch('/tenant-ai/status?tenant_id=' + encodeURIComponent(CFG.TENANT_ID), { method: 'GET' });
  }

  async function setEnabled(enabled) {
    return apiFetch('/tenant-ai/toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tenant_id: CFG.TENANT_ID, enabled: !!enabled }),
    });
  }

  function findSidebar() {
    return $('[data-testid="sidebar-primary"]') || $('aside');
  }

  function findAnyList() {
    const sb = findSidebar();
    if (!sb) return null;
    return $('ul', sb);
  }

  function findListAndRefByLabel(labelWanted) {
    const sb = findSidebar();
    if (!sb) return { list: null, ref: null };
    const wanted = normalize(labelWanted);
    const uls = $$('ul', sb);
    for (const ul of uls) {
      const lis = $$(':scope > li', ul);
      for (const li of lis) {
        const txt = normalize(li.textContent);
        if (txt === wanted || txt.includes(wanted)) {
          return { list: ul, ref: li };
        }
      }
    }
    return { list: null, ref: null };
  }

  function paintPanel() {
    const panel = $('#boom-ia-panel');
    if (!panel) return;
    const t = themeColors();
    panel.style.background = t.bg;
    panel.style.color = t.fg;
    panel.style.borderLeft = CFG.SHOW_BORDER ? '1px solid ' + t.border : 'none';
    const title = $('#boom-ia-panel-title');
    if (title) title.style.color = t.fg;
    const sub = $('#boom-ia-panel-sub');
    if (sub) sub.style.color = t.muted;
    const status = $('#boom-ia-status');
    if (status) {
      status.style.background = document.documentElement.classList.contains('dark') ? 'rgba(255,255,255,.06)' : 'rgba(15,23,42,.06)';
      status.style.color = t.fg;
    }
  }

  function layoutPanel() {
    const panel = $('#boom-ia-panel');
    if (!panel || panel.style.display === 'none') return;
    const sb = findSidebar();
    if (!sb) return;
    const r = sb.getBoundingClientRect();
    panel.style.position = 'fixed';
    panel.style.top = '0';
    panel.style.left = r.right + 'px';
    panel.style.width = Math.max(320, window.innerWidth - r.right) + 'px';
    panel.style.height = '100vh';
    panel.style.zIndex = '99990';
    panel.style.overflow = 'auto';
    panel.style.padding = CFG.PADDING + 'px';
    panel.style.boxSizing = 'border-box';
    paintPanel();
  }

  function ensurePanel() {
    if ($('#boom-ia-panel')) return $('#boom-ia-panel');

    const panel = document.createElement('div');
    panel.id = 'boom-ia-panel';
    panel.style.display = 'none';
    panel.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:16px;max-width:520px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
          <div style="flex:1;">
            <div id="boom-ia-panel-title" style="font-size:18px;font-weight:700;margin-bottom:4px;"></div>
            <div id="boom-ia-panel-sub" style="font-size:12px;">Liga ou desliga a IA para <strong>toda</strong> a organização nesta tenant (todos os agentes / webhooks).</div>
          </div>
          <button type="button" id="boom-ia-btn-close" title="Fechar" style="cursor:pointer;flex-shrink:0;width:36px;height:36px;border-radius:8px;border:1px solid rgba(128,128,128,.35);background:transparent;color:inherit;font-size:18px;line-height:1;">×</button>
        </div>
        <div id="boom-ia-diag" style="font-size:11px;line-height:1.45;padding:10px 12px;border-radius:8px;font-family:ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;"></div>
        <div id="boom-ia-status" style="border-radius:10px;padding:12px 14px;font-size:14px;font-weight:600;white-space:pre-wrap;">
          A carregar estado…
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:10px;">
          <button type="button" id="boom-ia-btn-on" style="cursor:pointer;padding:10px 18px;border-radius:10px;border:0;background:#166534;color:#fff;font-weight:600;font-size:14px;">
            Ligar IA (global)
          </button>
          <button type="button" id="boom-ia-btn-off" style="cursor:pointer;padding:10px 18px;border-radius:10px;border:0;background:#9a3412;color:#fff;font-weight:600;font-size:14px;">
            Desligar IA (global)
          </button>
          <button type="button" id="boom-ia-btn-refresh" style="cursor:pointer;padding:10px 14px;border-radius:10px;border:1px solid rgba(128,128,128,.35);background:transparent;color:inherit;font-weight:600;font-size:14px;">
            Atualizar
          </button>
        </div>
        <div id="boom-ia-foot" style="font-size:11px;opacity:.75;font-family:ui-monospace,monospace;"></div>
      </div>
    `;
    document.body.appendChild(panel);
    const titleNode = $('#boom-ia-panel-title');
    if (titleNode) titleNode.textContent = CFG.PANEL_TITLE;

    const statusEl = () => $('#boom-ia-status');
    const foot = () => $('#boom-ia-foot');
    const diagEl = () => $('#boom-ia-diag');

    function paintDiag(ok) {
      const d = diagEl();
      if (!d) return;
      const t = themeColors();
      d.style.background = ok ? (t.fg === '#0f172a' ? '#e0f2fe' : 'rgba(56,189,248,.12)') : 'rgba(220,38,38,.08)';
      d.style.color = t.fg;
      d.style.border = '1px solid ' + t.border;
      d.textContent =
        'Origem (cola no servidor): ' +
        window.location.origin +
        '\nAPI: ' +
        apiBase() +
        '/api/tenant-ai/…' +
        '\nServidor .env: TENANT_AI_TOGGLE_CORS_ORIGINS=' +
        window.location.origin +
        '\n(ou TENANT_AI_TOGGLE_CORS_ORIGINS=*.teudominio.com)';
    }

    on($('#boom-ia-btn-close'), 'click', () => {
      if (typeof window.__boomIaHidePanel === 'function') window.__boomIaHidePanel();
    });

    async function refreshStatus() {
      const st = statusEl();
      if (!st) return;
      st.textContent = 'A carregar estado…';
      const f = foot();
      if (f) f.textContent = '';
      paintDiag(true);
      try {
        const j = await loadStatus();
        const on = j.ai_globally_enabled !== false;
        st.textContent = on ? 'Estado: IA global LIGADA' : 'Estado: IA global DESLIGADA';
        st.style.borderLeft = '4px solid ' + (on ? '#16a34a' : '#ea580c');
        if (f) f.textContent = 'tenant_id: ' + (CFG.TENANT_ID || '').slice(0, 8) + '…';
      } catch (e) {
        st.textContent = 'Erro: ' + ((e && e.message) || String(e));
        st.style.borderLeft = '4px solid #dc2626';
        paintDiag(false);
        if (f)
          f.textContent =
            'No Easypanel/VPS: reinicia o serviço Node após alterar .env. Testa GET no browser só com curl (não substitui CORS).';
      }
    }

    on($('#boom-ia-btn-on'), 'click', async () => {
      $('#boom-ia-btn-on').disabled = $('#boom-ia-btn-off').disabled = true;
      try {
        await setEnabled(true);
        toast('IA global ligada.', true);
        await refreshStatus();
      } catch (e) {
        toast((e && e.message) || String(e), false);
      } finally {
        $('#boom-ia-btn-on').disabled = $('#boom-ia-btn-off').disabled = false;
      }
    });
    on($('#boom-ia-btn-off'), 'click', async () => {
      $('#boom-ia-btn-on').disabled = $('#boom-ia-btn-off').disabled = true;
      try {
        await setEnabled(false);
        toast('IA global desligada.', true);
        await refreshStatus();
      } catch (e) {
        toast((e && e.message) || String(e), false);
      } finally {
        $('#boom-ia-btn-on').disabled = $('#boom-ia-btn-off').disabled = false;
      }
    });
    on($('#boom-ia-btn-refresh'), 'click', () => refreshStatus());

    window.__boomIaShowPanel = async () => {
      panel.style.display = 'block';
      layoutPanel();
      await refreshStatus();
    };
    window.__boomIaHidePanel = () => {
      panel.style.display = 'none';
    };

    on(window, 'resize', layoutPanel);
    const mo = new MutationObserver(() => {
      layoutPanel();
      paintPanel();
    });
    mo.observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'data-theme'] });
    mo.observe(document.body, { attributes: true, attributeFilter: ['class'] });

    return panel;
  }

  function ensureSidebarLink() {
    if ($('#boom-ia-sidebar-li')) return;

    const li = document.createElement('li');
    li.id = 'boom-ia-sidebar-li';
    li.style.listStyle = 'none';
    li.innerHTML = `
      <a href="javascript:void(0)" class="boom-ia-sidebar-a" style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;text-decoration:none;color:inherit;">
        <span aria-hidden="true"></span><span></span>
      </a>`;
    const link = li.querySelector('a');
    const spans = li.querySelectorAll('span');
    if (spans[0]) spans[0].textContent = CFG.LINK_ICON || '';
    if (spans[1]) spans[1].textContent = CFG.LINK_TEXT || 'IA Global';

    let parentList = null;
    let ref = null;

    if (CFG.POSITION.mode === 'afterLabel' || CFG.POSITION.mode === 'beforeLabel') {
      const found = findSidebarInsertRef();
      parentList = found.list;
      ref = found.ref;
    }
    if (!parentList) parentList = findAnyList();
    if (!parentList) return;

    const items = $$(':scope > li', parentList);
    switch (CFG.POSITION.mode) {
      case 'start':
        parentList.insertBefore(li, items[0] || null);
        break;
      case 'index':
        parentList.insertBefore(li, items[Math.max(0, Math.min(CFG.POSITION.index, items.length))] || null);
        break;
      case 'afterLabel':
        if (ref && ref.nextSibling) parentList.insertBefore(li, ref.nextSibling);
        else parentList.appendChild(li);
        break;
      case 'beforeLabel':
        if (ref) parentList.insertBefore(li, ref);
        else parentList.insertBefore(li, items[0] || null);
        break;
      case 'end':
      default:
        parentList.appendChild(li);
    }

    on(link, 'mouseenter', () => {
      link.style.background = 'rgba(128,128,128,.14)';
    });
    on(link, 'mouseleave', () => {
      link.style.background = 'transparent';
    });

    on(link, 'click', (ev) => {
      ev.preventDefault();
      if (isOverlayMode()) {
        ensurePanel();
        const p = $('#boom-ia-panel');
        const open = p && p.style.display !== 'none';
        if (open) {
          window.__boomIaHidePanel();
        } else {
          window.__boomIaShowPanel();
        }
        return;
      }
      if (isNewTabMode()) {
        openStandaloneTenantIaPage();
        return;
      }
      toggleTenantIaModal();
    });
  }

  function boomIaEscapeHandler(ev) {
    if (ev.key !== 'Escape') return;
    if (isModalVisible()) {
      hideTenantIaModal();
      return;
    }
    if (isOverlayMode()) {
      const p = $('#boom-ia-panel');
      if (p && p.style.display !== 'none' && typeof window.__boomIaHidePanel === 'function') {
        window.__boomIaHidePanel();
      }
    }
  }

  function boot() {
    if (isOverlayMode()) {
      ensurePanel();
      layoutPanel();
    }
    document.addEventListener('keydown', boomIaEscapeHandler, true);
    ensureSidebarLink();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  new MutationObserver(() => {
    ensureSidebarLink();
    if (isOverlayMode()) layoutPanel();
  }).observe(document.body, { childList: true, subtree: true });
})();
</script>
