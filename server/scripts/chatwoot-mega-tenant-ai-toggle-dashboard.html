<!--
  Boom — Dashboard Script (Mega / Chatwoot): ativa/desativa todos os agentes da tenant (status active/inactive nos webhooks)
  ---------------------------------------------------------------------------
  1. CFG.API_BASE_URL = URL pública HTTPS do Boom (ex. https://ia.agboom.com.br). Podes terminar em /api ou não — o script normaliza.
  2. Servidor .env: TENANT_AI_TOGGLE_SECRET + UMA destas para CORS:
     TENANT_AI_TOGGLE_CORS_ORIGINS=https://exato-do-mega.com
     ou padrão wildcard: TENANT_AI_TOGGLE_CORS_ORIGINS=*.seudominio.com
     ou (só teste): TENANT_AI_TOGGLE_CORS_REFLECT=true
  3. Cola SÓ o bloco <script>...</script> em Super Admin → Dashboard Scripts → Guardar.
  4. ACCOUNT_SCOPE: só injeta no Mega nas contas listadas; tenant Boom por account_id (ex. /app/accounts/9/ → PPL Motors).

  TROUBLESHOOTING:
  - "sem agentes nesta tenant" = CORS e auth OK, mas tenant_id não tem agentes no banco.
    Confirma o UUID em: SELECT id, name FROM tenants; e SELECT id, status FROM agents WHERE tenant_id='...';
  - "Unauthorized" = TENANT_AI_TOGGLE_SECRET no .env do servidor não bate com TOGGLE_SECRET aqui.
  - "Failed to fetch" / CORS = adiciona TENANT_AI_TOGGLE_CORS_ORIGINS=<origin do Mega> no .env do servidor e reinicia.
  - Após alterar .env em produção (Easypanel): reinicia o serviço Node.
-->
<script>
(function () {
  'use strict';

  /** ========== CONFIGURAÇÃO (obrigatório preencher) ========== */
  const CFG = {
    API_BASE_URL: 'https://ia.agboom.com.br',
    /** Fallback; com ACCOUNT_SCOPE ativo o TENANT_ID é sobrescrito pelo mapa. */
    TENANT_ID: 'bc4a1dc9-a205-4b4b-9b6c-47bf677a2728',
    TOGGLE_SECRET: '12345678910',

    ACCOUNT_SCOPE: {
      allowedAccountIds: [9],
      tenantByAccountId: {
        9: 'bc4a1dc9-a205-4b4b-9b6c-47bf677a2728',
      },
    },

    LINK_TEXT: 'Agentes IA',
    LINK_ICON: '🤖',
    POSITION: { mode: 'afterLabel', labels: ['Conversas', 'Conversations'], index: 0 },
    PANEL_TITLE: 'Agentes IA',
  };

  /* ─── helpers ─── */
  function megaAccountIdFromPath() {
    var m = String(window.location.pathname || '').match(/\/accounts\/(\d+)/);
    return m ? Number(m[1]) : null;
  }

  function applyMegaAccountScope() {
    var s = CFG.ACCOUNT_SCOPE;
    if (!s) return true;
    var aid = megaAccountIdFromPath();
    if (s.tenantByAccountId && aid != null) {
      var tid = s.tenantByAccountId[aid] || s.tenantByAccountId[String(aid)];
      if (tid) CFG.TENANT_ID = String(tid);
    }
    if (s.allowedAccountIds && s.allowedAccountIds.length) {
      if (aid == null || !s.allowedAccountIds.includes(aid)) return false;
    }
    return true;
  }

  if (!applyMegaAccountScope()) return;

  var qs = function (sel, root) { try { return (root || document).querySelector(sel); } catch (e) { return null; } };
  var qsa = function (sel, root) { try { return Array.from((root || document).querySelectorAll(sel)); } catch (e) { return []; } };
  var normalize = function (s) { return (s || '').toLowerCase().replace(/\s+/g, ' ').trim(); };

  function apiBase() {
    var s = String(CFG.API_BASE_URL || '').trim().replace(/\/+$/, '');
    if (/\/api$/i.test(s)) s = s.replace(/\/api$/i, '');
    return s;
  }

  var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

  function isUuidOk() { return UUID_RE.test(CFG.TENANT_ID || ''); }

  function networkPrecheck() {
    var base = apiBase();
    if (!base) return 'Define CFG.API_BASE_URL no script.';
    try {
      var aURL = new URL(base.indexOf('http') === 0 ? base : 'https://' + base);
      var pURL = new URL(window.location.href);
      if (pURL.protocol === 'https:' && aURL.protocol === 'http:') return 'Página HTTPS + API HTTP = mixed content bloqueado. Usa https:// na API.';
    } catch (e) { return 'API_BASE_URL inválida.'; }
    return null;
  }

  function explainErr(e) {
    var m = (e && e.message) || String(e);
    if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) {
      return m + '\n\nCORS: adiciona no servidor:\nTENANT_AI_TOGGLE_CORS_ORIGINS=' + window.location.origin + '\ne reinicia o Node.';
    }
    return m;
  }

  function apiFetch(path, opts) {
    var pre = networkPrecheck();
    if (pre) return Promise.reject(new Error(pre));
    var url = apiBase() + '/api' + path;
    var headers = Object.assign({ 'x-tenant-ai-toggle-secret': CFG.TOGGLE_SECRET, 'Accept': 'application/json' }, (opts && opts.headers) || {});
    return fetch(url, Object.assign({ credentials: 'omit', mode: 'cors' }, opts || {}, { headers: headers }))
      .catch(function (e) { throw new Error(explainErr(e)); })
      .then(function (r) {
        return r.text().then(function (t) {
          var j = {}; try { j = t ? JSON.parse(t) : {}; } catch (x) { j = { raw: t }; }
          if (!r.ok) { var err = j.error || j.message || t || r.statusText; throw new Error(typeof err === 'string' ? err : JSON.stringify(err)); }
          return j;
        });
      });
  }

  function loadStatus() {
    if (!isUuidOk()) return Promise.reject(new Error('TENANT_ID inválido. Define um UUID válido em CFG.'));
    return apiFetch('/tenant-ai/status?tenant_id=' + encodeURIComponent(CFG.TENANT_ID), { method: 'GET' });
  }

  function setEnabled(enabled) {
    return apiFetch('/tenant-ai/toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tenant_id: CFG.TENANT_ID, enabled: !!enabled }),
    });
  }

  /* ─── Chatwoot-native modal CSS ─── */
  /* Segue o design system do Chatwoot: variáveis --color-*, fontes Inter, border-radius 8px, sombra leve */
  var MODAL_CSS = [
    '#bm-scrim{',
    'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;',
    'padding:20px 16px;background:rgba(0,0,0,.4);',
    'opacity:0;visibility:hidden;pointer-events:none;',
    'transition:opacity .2s,visibility .2s;',
    '}',
    '#bm-scrim.bm-open{opacity:1;visibility:visible;pointer-events:auto;}',

    '#bm-dialog{',
    'position:relative;width:100%;max-width:420px;',
    'background:var(--color-white,#fff);',
    'border-radius:8px;',
    'box-shadow:0 20px 60px rgba(0,0,0,.18),0 4px 16px rgba(0,0,0,.08);',
    'overflow:hidden;',
    'transform:translateY(12px) scale(.97);opacity:0;',
    'transition:transform .22s cubic-bezier(.16,1,.3,1),opacity .18s ease;',
    'font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;',
    '}',
    '#bm-scrim.bm-open #bm-dialog{transform:none;opacity:1;}',

    /* dark — Chatwoot usa classe .dark-theme no <html> ou html[data-theme=dark] */
    'html.dark-theme #bm-dialog,html[data-theme=dark] #bm-dialog{',
    'background:var(--color-background-dark,#1f2937);',
    'box-shadow:0 20px 60px rgba(0,0,0,.5),0 4px 16px rgba(0,0,0,.3);',
    '}',

    /* header: barra azul Chatwoot */
    '#bm-hdr{',
    'display:flex;align-items:center;justify-content:space-between;',
    'padding:16px 20px 14px;',
    'border-bottom:1px solid var(--color-border,rgba(0,0,0,.08));',
    '}',
    'html.dark-theme #bm-hdr,html[data-theme=dark] #bm-hdr{border-color:rgba(255,255,255,.08);}',

    '#bm-hdr-left{display:flex;align-items:center;gap:10px;}',

    /* ícone robô */
    '#bm-icon{',
    'width:32px;height:32px;border-radius:6px;',
    'background:var(--color-woot-500,#1f93ff);',
    'display:flex;align-items:center;justify-content:center;',
    'font-size:16px;flex-shrink:0;',
    '}',

    '#bm-title{',
    'font-size:15px;font-weight:600;line-height:1.3;',
    'color:var(--color-heading,#1f2937);margin:0;',
    '}',
    'html.dark-theme #bm-title,html[data-theme=dark] #bm-title{color:var(--color-heading-dark,#f9fafb);}',

    '#bm-close{',
    'width:28px;height:28px;border-radius:6px;border:0;background:transparent;',
    'cursor:pointer;display:flex;align-items:center;justify-content:center;',
    'color:var(--color-body,#6b7280);font-size:18px;line-height:1;',
    'transition:background .12s,color .12s;flex-shrink:0;',
    '}',
    '#bm-close:hover{background:var(--color-background-light,#f3f4f6);color:var(--color-heading,#1f2937);}',
    'html.dark-theme #bm-close:hover,html[data-theme=dark] #bm-close:hover{background:rgba(255,255,255,.08);color:#f9fafb;}',

    /* body */
    '#bm-body{padding:18px 20px 16px;}',

    '#bm-desc{',
    'font-size:13px;line-height:1.55;color:var(--color-body,#6b7280);',
    'margin:0 0 14px;',
    '}',
    'html.dark-theme #bm-desc,html[data-theme=dark] #bm-desc{color:rgba(255,255,255,.5);}',

    /* status badge — imita os badges do Chatwoot */
    '#bm-status{',
    'display:flex;align-items:flex-start;gap:10px;',
    'padding:11px 14px;border-radius:6px;margin:0 0 14px;',
    'font-size:13px;font-weight:500;line-height:1.45;',
    'border:1px solid;',
    '}',
    '#bm-status.bm-ok{color:#065f46;background:#ecfdf5;border-color:#a7f3d0;}',
    '#bm-status.bm-warn{color:#92400e;background:#fffbeb;border-color:#fcd34d;}',
    '#bm-status.bm-err{color:#991b1b;background:#fef2f2;border-color:#fca5a5;}',
    '#bm-status.bm-idle{color:var(--color-body,#6b7280);background:var(--color-background-light,#f9fafb);border-color:var(--color-border,#e5e7eb);}',
    'html.dark-theme #bm-status.bm-idle,html[data-theme=dark] #bm-status.bm-idle{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08);}',
    'html.dark-theme #bm-status.bm-ok,html[data-theme=dark] #bm-status.bm-ok{color:#6ee7b7;background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.25);}',
    'html.dark-theme #bm-status.bm-warn,html[data-theme=dark] #bm-status.bm-warn{color:#fcd34d;background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.25);}',
    'html.dark-theme #bm-status.bm-err,html[data-theme=dark] #bm-status.bm-err{color:#fca5a5;background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.25);}',

    '#bm-status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}',
    '#bm-status.bm-ok #bm-status-dot{background:#10b981;}',
    '#bm-status.bm-warn #bm-status-dot{background:#f59e0b;}',
    '#bm-status.bm-err #bm-status-dot{background:#ef4444;}',
    '#bm-status.bm-idle #bm-status-dot{background:#9ca3af;}',

    /* detalhes técnicos colapsáveis */
    '#bm-diag-wrap{margin:0 0 14px;}',
    '#bm-diag-toggle{',
    'font-size:12px;color:var(--color-woot-500,#1f93ff);background:none;border:0;',
    'cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;',
    '}',
    '#bm-diag-toggle:hover{color:var(--color-woot-600,#1a7de0);}',
    '#bm-diag{',
    'display:none;margin-top:8px;padding:10px 12px;border-radius:6px;',
    'font-size:11px;line-height:1.5;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;',
    'white-space:pre-wrap;word-break:break-all;',
    'background:var(--color-background-light,#f9fafb);',
    'border:1px solid var(--color-border,#e5e7eb);',
    'color:var(--color-body,#6b7280);',
    '}',
    '#bm-diag.bm-diag-open{display:block;}',
    '#bm-diag.bm-diag-err{border-color:#fca5a5;background:#fef2f2;color:#991b1b;}',
    'html.dark-theme #bm-diag,html[data-theme=dark] #bm-diag{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.08);color:rgba(255,255,255,.4);}',
    'html.dark-theme #bm-diag.bm-diag-err,html[data-theme=dark] #bm-diag.bm-diag-err{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.25);color:#fca5a5;}',

    /* actions — imita footer de modal do Chatwoot */
    '#bm-footer{',
    'display:flex;flex-wrap:wrap;gap:8px;',
    'padding:14px 20px 16px;',
    'border-top:1px solid var(--color-border,rgba(0,0,0,.08));',
    '}',
    'html.dark-theme #bm-footer,html[data-theme=dark] #bm-footer{border-color:rgba(255,255,255,.08);}',

    '.bm-btn{',
    'cursor:pointer;height:36px;padding:0 14px;border-radius:6px;',
    'font-family:inherit;font-size:13px;font-weight:500;line-height:1;',
    'display:inline-flex;align-items:center;justify-content:center;gap:6px;',
    'transition:background .12s,border-color .12s,color .12s,opacity .12s;',
    'white-space:nowrap;',
    '}',
    '.bm-btn:disabled{opacity:.5;cursor:not-allowed;}',

    /* primary — verde para "ativar" */
    '.bm-btn-primary{background:#10b981;border:1px solid #10b981;color:#fff;}',
    '.bm-btn-primary:hover:not(:disabled){background:#059669;border-color:#059669;}',

    /* danger — laranja para "desativar" */
    '.bm-btn-danger{background:transparent;border:1px solid #f59e0b;color:#b45309;}',
    '.bm-btn-danger:hover:not(:disabled){background:#fffbeb;border-color:#d97706;}',
    'html.dark-theme .bm-btn-danger,html[data-theme=dark] .bm-btn-danger{color:#fcd34d;border-color:#92400e;}',
    'html.dark-theme .bm-btn-danger:hover:not(:disabled),html[data-theme=dark] .bm-btn-danger:hover:not(:disabled){background:rgba(245,158,11,.1);}',

    /* ghost */
    '.bm-btn-ghost{background:transparent;border:1px solid var(--color-border,#e5e7eb);color:var(--color-body,#6b7280);}',
    '.bm-btn-ghost:hover:not(:disabled){background:var(--color-background-light,#f3f4f6);color:var(--color-heading,#1f2937);}',
    'html.dark-theme .bm-btn-ghost,html[data-theme=dark] .bm-btn-ghost{border-color:rgba(255,255,255,.12);color:rgba(255,255,255,.6);}',
    'html.dark-theme .bm-btn-ghost:hover:not(:disabled),html[data-theme=dark] .bm-btn-ghost:hover:not(:disabled){background:rgba(255,255,255,.06);color:#f9fafb;}',

    /* spinner inline */
    '@keyframes bm-spin{to{transform:rotate(360deg);}}',
    '.bm-spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:bm-spin .7s linear infinite;}',

    /* toast */
    '#bm-toast{',
    'position:fixed;bottom:20px;right:20px;z-index:100001;',
    'max-width:320px;padding:10px 14px;border-radius:6px;',
    'font:13px/1.4 -apple-system,BlinkMacSystemFont,"Inter",sans-serif;',
    'color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.2);',
    'display:none;',
    '}',

    /* sidebar link */
    '#bm-sidebar-li{list-style:none;}',
    '#bm-sidebar-a{',
    'display:flex;align-items:center;gap:8px;',
    'padding:8px 12px;border-radius:6px;',
    'text-decoration:none;color:inherit;',
    'font-size:14px;font-weight:500;',
    'transition:background .12s;cursor:pointer;',
    '}',
    '#bm-sidebar-a:hover{background:var(--color-background-light,rgba(0,0,0,.05));}',
  ].join('');

  /* ─── inject CSS once ─── */
  function ensureStyle() {
    if (qs('#bm-style')) return;
    var st = document.createElement('style');
    st.id = 'bm-style';
    st.textContent = MODAL_CSS;
    document.head.appendChild(st);
  }

  /* ─── status display ─── */
  function setStatus(cls, text) {
    var el = qs('#bm-status');
    if (!el) return;
    el.className = 'bm-status-box ' + cls; /* not the id attr */
    el.id = 'bm-status';
    el.className = cls;
    var dot = qs('#bm-status-dot');
    var msg = qs('#bm-status-msg');
    if (dot) { /* already structured */ }
    if (msg) msg.textContent = text;
    else el.textContent = text;
  }

  function buildStatusEl() {
    var el = qs('#bm-status');
    if (!el) return;
    el.innerHTML = '<span id="bm-status-dot"></span><span id="bm-status-msg">Carregando…</span>';
    el.className = 'bm-idle';
  }

  function applyStatus(cls, text) {
    var el = qs('#bm-status');
    if (!el) return;
    el.className = cls;
    var msg = qs('#bm-status-msg');
    if (msg) msg.textContent = text;
  }

  function statusFromResponse(j) {
    var total = typeof j.agents_total === 'number' ? j.agents_total : 0;
    var active = typeof j.agents_active_count === 'number' ? j.agents_active_count : 0;
    var allActive = j.agents_all_active === true;
    if (total === 0) return { cls: 'bm-warn', text: 'Nenhum agente encontrado nesta tenant.' };
    if (allActive) return { cls: 'bm-ok', text: 'Todos os ' + total + ' agentes estão Ativos — IA ativada nos webhooks.' };
    if (active === 0) return { cls: 'bm-warn', text: 'Todos os ' + total + ' agentes estão Inativos — IA desativada nos webhooks.' };
    return { cls: 'bm-warn', text: 'Estado misto: ' + active + ' de ' + total + ' agentes Ativos.' };
  }

  /* ─── diag block ─── */
  function setDiag(isErr) {
    var d = qs('#bm-diag');
    if (!d) return;
    var origin = window.location.origin;
    var base = apiBase();
    d.textContent = 'Origem: ' + origin + '\nAPI:    ' + base + '/api/tenant-ai/\n\n.env servidor:\nTENANT_AI_TOGGLE_SECRET=<igual ao TOGGLE_SECRET aqui>\nTENANT_AI_TOGGLE_CORS_ORIGINS=' + origin;
    d.className = isErr ? 'bm-diag-open bm-diag-err' : 'bm-diag-open';
    var btn = qs('#bm-diag-toggle');
    if (btn) btn.textContent = 'Ocultar detalhes técnicos';
  }

  /* ─── toast ─── */
  function toast(msg, ok) {
    var el = qs('#bm-toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'bm-toast';
      document.body.appendChild(el);
    }
    el.style.background = ok ? '#059669' : '#dc2626';
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.style.display = 'none'; }, 4500);
  }

  /* ─── refresh ─── */
  function refreshStatus() {
    applyStatus('bm-idle', 'Carregando estado…');
    var foot = qs('#bm-foot');
    if (foot) foot.textContent = '';
    return loadStatus()
      .then(function (j) {
        var s = statusFromResponse(j);
        applyStatus(s.cls, s.text);
        var total = typeof j.agents_total === 'number' ? j.agents_total : 0;
        if (foot) foot.textContent = 'tenant: ' + (CFG.TENANT_ID || '').slice(0, 8) + '…  ·  agentes: ' + total;
        var d = qs('#bm-diag');
        if (d) d.classList.remove('bm-diag-err');
      })
      .catch(function (e) {
        applyStatus('bm-err', (e && e.message) || String(e));
        setDiag(true);
        if (foot) foot.textContent = 'Reinicia o servidor Node após alterar .env.';
      });
  }

  /* ─── modal ─── */
  function isOpen() { var s = qs('#bm-scrim'); return !!(s && s.classList.contains('bm-open')); }
  function closeModal() { var s = qs('#bm-scrim'); if (s) s.classList.remove('bm-open'); }

  function openModal() {
    ensureStyle();
    if (!qs('#bm-scrim')) buildModal();
    buildStatusEl();
    var s = qs('#bm-scrim');
    if (!s) return;
    s.classList.remove('bm-open');
    void s.offsetWidth;
    requestAnimationFrame(function () { requestAnimationFrame(function () { s.classList.add('bm-open'); }); });
    var h = qs('#bm-title'); if (h) h.textContent = CFG.PANEL_TITLE || 'Agentes IA';
    refreshStatus();
  }

  function toggleModal() { if (isOpen()) closeModal(); else openModal(); }

  function setLoading(on) {
    var btnOn = qs('#bm-btn-on');
    var btnOff = qs('#bm-btn-off');
    if (btnOn) btnOn.disabled = on;
    if (btnOff) btnOff.disabled = on;
  }

  function buildModal() {
    var wrap = document.createElement('div');
    wrap.id = 'bm-scrim';
    wrap.setAttribute('role', 'presentation');
    wrap.innerHTML = [
      '<div id="bm-dialog" role="dialog" aria-modal="true" aria-labelledby="bm-title">',

      /* header */
      '  <div id="bm-hdr">',
      '    <div id="bm-hdr-left">',
      '      <div id="bm-icon" aria-hidden="true">🤖</div>',
      '      <h2 id="bm-title" class="bm-title"></h2>',
      '    </div>',
      '    <button type="button" id="bm-close" aria-label="Fechar">',
      '      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 4L4 12M4 4l8 8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>',
      '    </button>',
      '  </div>',

      /* body */
      '  <div id="bm-body">',
      '    <p id="bm-desc">Define o status <strong>Ativo / Inativo</strong> de todos os agentes desta tenant. Agentes inativos não processam mensagens recebidas nos webhooks.</p>',

      '    <div id="bm-status" class="bm-idle">',
      '      <span id="bm-status-dot"></span>',
      '      <span id="bm-status-msg">Carregando…</span>',
      '    </div>',

      '    <div id="bm-diag-wrap">',
      '      <button type="button" id="bm-diag-toggle">Mostrar detalhes técnicos</button>',
      '      <pre id="bm-diag"></pre>',
      '    </div>',
      '  </div>',

      /* footer */
      '  <div id="bm-footer">',
      '    <button type="button" class="bm-btn bm-btn-primary" id="bm-btn-on">',
      '      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1zm0 1.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11zM6.5 5.25l4.5 2.75-4.5 2.75V5.25z" fill="currentColor"/></svg>',
      '      Ativar todos',
      '    </button>',
      '    <button type="button" class="bm-btn bm-btn-danger" id="bm-btn-off">',
      '      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1zm0 1.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11zM6 6h4v4H6V6z" fill="currentColor"/></svg>',
      '      Desativar todos',
      '    </button>',
      '    <button type="button" class="bm-btn bm-btn-ghost" id="bm-btn-ref">Atualizar</button>',
      '    <p id="bm-foot" style="width:100%;margin:4px 0 0;font-size:11px;color:var(--color-body,#9ca3af);font-family:ui-monospace,monospace;"></p>',
      '  </div>',
      '</div>',
    ].join('');
    document.body.appendChild(wrap);

    /* close on scrim click */
    wrap.addEventListener('click', function (ev) { if (ev.target === wrap) closeModal(); });

    qs('#bm-close').addEventListener('click', function (e) { e.stopPropagation(); closeModal(); });

    qs('#bm-diag-toggle').addEventListener('click', function () {
      var d = qs('#bm-diag');
      if (!d) return;
      var open = d.classList.contains('bm-diag-open');
      if (open) { d.classList.remove('bm-diag-open'); this.textContent = 'Mostrar detalhes técnicos'; }
      else { setDiag(false); this.textContent = 'Ocultar detalhes técnicos'; }
    });

    qs('#bm-btn-ref').addEventListener('click', function () { refreshStatus(); });

    qs('#bm-btn-on').addEventListener('click', function () {
      setLoading(true);
      setEnabled(true)
        .then(function () {
          toast('Todos os agentes ativados.', true);
          return refreshStatus();
        })
        .catch(function (e) { toast((e && e.message) || String(e), false); })
        .finally(function () { setLoading(false); });
    });

    qs('#bm-btn-off').addEventListener('click', function () {
      setLoading(true);
      setEnabled(false)
        .then(function () {
          toast('Todos os agentes desativados.', true);
          return refreshStatus();
        })
        .catch(function (e) { toast((e && e.message) || String(e), false); })
        .finally(function () { setLoading(false); });
    });
  }

  /* ─── sidebar link ─── */
  function findSidebar() { return qs('[data-testid="sidebar-primary"]') || qs('aside'); }
  function findAnyList() { var sb = findSidebar(); return sb ? qs('ul', sb) : null; }

  function findInsertRef() {
    var labels = Array.isArray(CFG.POSITION.labels) ? CFG.POSITION.labels : ['Conversas', 'Conversations'];
    var sb = findSidebar();
    if (!sb) return { list: null, ref: null };
    for (var i = 0; i < labels.length; i++) {
      var want = normalize(labels[i]);
      var uls = qsa('ul', sb);
      for (var u = 0; u < uls.length; u++) {
        var lis = qsa(':scope > li', uls[u]);
        for (var l = 0; l < lis.length; l++) {
          if (normalize(lis[l].textContent).indexOf(want) !== -1) return { list: uls[u], ref: lis[l] };
        }
      }
    }
    return { list: null, ref: null };
  }

  function ensureSidebarLink() {
    if (qs('#bm-sidebar-li')) return;
    var li = document.createElement('li');
    li.id = 'bm-sidebar-li';

    var a = document.createElement('a');
    a.id = 'bm-sidebar-a';
    a.href = 'javascript:void(0)';
    a.setAttribute('role', 'button');
    a.innerHTML = '<span aria-hidden="true" style="font-size:16px">' + (CFG.LINK_ICON || '🤖') + '</span><span>' + (CFG.LINK_TEXT || 'Agentes IA') + '</span>';
    li.appendChild(a);

    var found = findInsertRef();
    var parentList = found.list || findAnyList();
    if (!parentList) return;

    var ref = found.ref;
    if (ref && ref.nextSibling) parentList.insertBefore(li, ref.nextSibling);
    else parentList.appendChild(li);

    a.addEventListener('click', function (ev) { ev.preventDefault(); toggleModal(); });
  }

  /* ─── esc key ─── */
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && isOpen()) { closeModal(); ev.stopPropagation(); }
  }, true);

  /* ─── boot ─── */
  function boot() {
    ensureStyle();
    ensureSidebarLink();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  /* re-inject link if Chatwoot re-renders the sidebar (SPA navigation) */
  new MutationObserver(function () { ensureSidebarLink(); })
    .observe(document.body, { childList: true, subtree: true });
})();
</script>
