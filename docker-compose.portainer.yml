# =============================================================================
# Boom IA - Stack Portainer Swarm (com pull explícito)
# =============================================================================
# Se as imagens já estão públicas e ainda fica 0/1:
# 1. Remova a stack (Remove stack), depois crie de novo e cole este compose.
# 2. Em cada serviço, use image sem :latest e force pull (Redeploy).
# 3. Veja o erro: Services > clique no serviço > Tasks > clique na tarefa falha.
# =============================================================================

version: '3.8'

services:
  server:
    image: ghcr.io/kevenmor/boom-ia-server:latest
    environment:
      PORT: "3001"
      NODE_ENV: "production"
      NEXUS_DB_URL: "https://boomsolution-supabase.kgn6uc.easypanel.com"
      NEXUS_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q"
      NEXUS_DB_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE"
      ENCRYPTION_KEY: "change-me-32-chars-minimum!!"
      API_BASE_URL: "https://ia.agboom.com.br"
      CORS_ORIGINS: "https://ia.agboom.com.br"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: start-first
        failure_action: rollback

  frontend:
    image: ghcr.io/kevenmor/boom-ia-frontend:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  proxy:
    image: ghcr.io/kevenmor/boom-ia-proxy:latest
    ports:
      # Porta 80: acesse por http://ia.agboom.com.br (DNS apontando para o IP da VPS)
      # Se a porta 80 já estiver em uso (ex.: Caddy/nginx para SSL), use target: 80 / published: 8081
      # e configure o proxy externo para encaminhar ia.agboom.com.br para localhost:8081
      - target: 80
        published: 80
        mode: host
    deploy:
      replicas: 1
      restart_policy:
        condition: any
