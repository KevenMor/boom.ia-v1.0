# =============================================================================
# Boom IA - Stack Portainer Swarm (com pull explícito)
# =============================================================================
# Traefik: proxy na rede do Traefik (minha_rede) + labels para ia.agboom.com.br (sem :8081).
# =============================================================================

version: '3.8'

networks:
  internal:
    driver: overlay
  minha_rede:
    external: true

services:
  server:
    image: ghcr.io/kevenmor/boom-ia-server:latest
    networks:
      - internal
    environment:
      PORT: "3001"
      NODE_ENV: "production"
      NEXUS_DB_URL: "https://boomsolution-supabase.kgn6uc.easypanel.host"
      NEXUS_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q"
      NEXUS_DB_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE"
      ENCRYPTION_KEY: "change-me-32-chars-minimum!!"
      OPENAI_API_KEY: "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"
      GEMINI_API_KEY: "AIzaSyDsSKTvCIDGH3RaRq0m7ue6TtIWEhbfvpQ"
      API_BASE_URL: "https://ia.agboom.com.br"
      CORS_ORIGINS: "https://ia.agboom.com.br,http://localhost:8080,http://127.0.0.1:8080"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: start-first
        failure_action: rollback

  # Frontend: imagem pré-buildada. Rebuild com --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=<NEXUS_DB_ANON_KEY>
  frontend:
    image: ghcr.io/kevenmor/boom-ia-frontend:latest
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  proxy:
    image: ghcr.io/kevenmor/boom-ia-proxy:latest
    networks:
      - internal
      - minha_rede
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        # Traefik: ia.agboom.com.br -> proxy:80 (rede minha_rede = rede do Traefik na VPS)
        - "traefik.enable=true"
        - "traefik.docker.network=minha_rede"
        - "traefik.http.routers.boom-ia.rule=Host(`ia.agboom.com.br`)"
        - "traefik.http.routers.boom-ia.entrypoints=web,websecure"
        - "traefik.http.routers.boom-ia.tls=true"
        - "traefik.http.routers.boom-ia.tls.certresolver=letsencrypt"
        - "traefik.http.services.boom-ia.loadbalancer.server.port=80"
