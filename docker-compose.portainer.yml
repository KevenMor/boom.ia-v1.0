# Boom IA - Stack para Portainer (variáveis já incluídas)
# Copie todo o conteúdo abaixo e cole no Web editor da stack. Não precisa preencher variáveis à parte.
#
# GitHub: GITHUB_USERNAME e GITHUB_TOKEN NÃO vão no compose. Eles são usados só pelo Portainer
# em "Repository authentication" quando você faz deploy a partir do Git. Com Web editor + imagens
# do GHCR, os containers não usam GitHub — não adicione essas variáveis aqui.
#
# Supabase: URL do Easypanel (boomsolution-supabase)

